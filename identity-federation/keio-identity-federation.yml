    x-operator: institution
    x-operator-evidence: >-
      The entityID is under Keio's own registrable domain keio.ac.jp. The metadata's Organization
      block names Keio University / 慶應義塾大学 with OrganizationURL http://www.keio.ac.jp, the
      technical contact is Keio University Information Technology Center
      (gakunin@itc.keio.ac.jp), and the asserted shibmd:Scope is keio.ac.jp. Nothing in the entity
      is a vendor's.
    registered_in:
