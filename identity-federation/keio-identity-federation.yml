source: >-
  https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml (HTTP 200, 5,653,150 bytes, fetched
  2026-09-01) — the signed aggregate metadata of GakuNin, the Japanese academic access-management
  federation operated by the National Institute of Informatics. Cross-checked against the eduGAIN
  entity register at https://technical.edugain.org/api.php?action=list_entities&format=json
  (HTTP 200), in which Keio's identity provider appears once, as entity 853677, registered by
  https://www.gakunin.jp. The EntityDescriptor for Keio is saved verbatim (certificates elided) to
  examples/keio-gakunin-idp-metadata.xml.
provider: Keio University
providerId: keio
description: >-
  Identity federation is the surface class a university operates by definition and is almost never
  catalogued for, and for Keio it is the strongest machine-readable artifact carrying the
  institution's own name. Keio University is a registered identity provider in GakuNin, the
  Japanese academic SAML federation NII operates, and through GakuNin's interfederation agreement
  its entity is republished in eduGAIN — so a service provider anywhere in the global research and
  education federation can discover and trust Keio's IdP without a bilateral agreement.


  The nuance worth stating plainly, and the reason this file separates the entity from its
  endpoints: the entityID and the asserted scope are Keio's, but the SAML endpoints the metadata
  advertises resolve to keio.ex-tic.com — a per-institution tenant on Extic, a Japanese identity
  SaaS platform. The identity, the namespace, the user population and the operational contact
  (gakunin@itc.keio.ac.jp, Keio Information Technology Center) are the institution's; the SSO
  service is running on rented software. Separately, gslbs.keio.jp — a Keio application host —
  redirects to a SAML request against keio.okta.com, so Keio also runs an Okta tenant whose OpenID
  Connect discovery document is publicly readable. Neither of those is a reason to strip the
  federation record; both are recorded honestly as tenancies alongside it.

