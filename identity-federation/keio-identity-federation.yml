    key_descriptors: 2
    endpoints:
      - service: SingleSignOnService
        binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
        location: https://keio.ex-tic.com/auth/gakunin/saml2/assertions
      - service: SingleSignOnService
        binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect
        location: https://keio.ex-tic.com/auth/gakunin/saml2/assertions
    endpoint_operator: tenant
    endpoint_operator_evidence: >-
      Both SSO bindings point at keio.ex-tic.com — a Keio-specific tenant subdomain on the Extic
      identity platform (ex-tic.com), returning HTTP 200. The entityID namespace is Keio's; the
      service answering the assertion request is Extic's software on a Keio tenant. Recorded as a
      tenancy, not deducted from the institution's ownership of the entity.
    contacts:
      - type: technical
        organization: Keio University Information Technology Center
        email: gakunin@itc.keio.ac.jp
    defects:
      - id: idp-host-tls-expired
        severity: informational
        detail: >-
          The entityID host gakunin1.keio.ac.jp presents an expired TLS certificate (curl exit 60,
          "certificate has expired", probed 2026-09-01). A SAML entityID is an identifier and is
          not required to dereference, so this does not break federation — but it does mean the
          host named in Keio's federation identity is not currently serving a valid certificate.
          Reported as observed.
        status_code: 0

  - name: Keio University Okta tenant — OpenID Connect discovery
    issuer: https://keio.okta.com
    x-operator: tenant
    x-operator-evidence: >-
      keio.okta.com is a Keio-specific tenant on Okta's identity platform. It was found because
      https://gslbs.keio.jp/ (a Keio application host, HTTP 200) redirects into a SAMLRequest
      against https://keio.okta.com/app/keio__52/.../sso/saml. The tenant, the users and the
      applications are Keio's; the identity service, its contract and its engineering are Okta's,
      and the discovery document is the one Okta publishes for every org.
    discovery_url: https://keio.okta.com/.well-known/openid-configuration
    discovery_status: 200
    authorization_server_discovery_url: https://keio.okta.com/oauth2/default/.well-known/openid-configuration
    authorization_server_discovery_status: 200
    endpoints:
      authorization_endpoint: https://keio.okta.com/oauth2/v1/authorize
      token_endpoint: https://keio.okta.com/oauth2/v1/token
      userinfo_endpoint: https://keio.okta.com/oauth2/v1/userinfo
      jwks_uri: https://keio.okta.com/oauth2/v1/keys
      registration_endpoint: https://keio.okta.com/oauth2/v1/clients
    artifact: examples/keio-okta-openid-configuration.json
    note: >-
      The discovery document is anonymously readable, but a client_id exists only if Keio's IT
      staff create one. There is no public or usable dynamic registration for an unaffiliated
      caller, so this is a readable surface, not a consumable one.

