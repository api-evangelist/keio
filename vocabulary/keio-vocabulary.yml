      - 'sc:Sequence'
      - 'sc:Canvas'
      - 'oa:Annotation'
      - 'dctypes:Image'
      - attribution
      - license
      - service
      - profile
      - tiles
      - sizes
    keio_authored_within:
      - term: archive code
        definition: >-
          Keio's own collection key inside the IIIF path — `GTB` for the Gutenberg 42-line Bible.
          Not published anywhere as a list; observed only in resolved URLs.

  - name: SAML / Shibboleth federation metadata
    x-operator: standard
    authored_by: OASIS / REFEDS / Shibboleth Consortium
