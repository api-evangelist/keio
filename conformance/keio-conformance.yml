generated: '2026-09-01'
method: derived
authorship: API Evangelist
probe_basis: live probe sweep of Keio University surfaces, 2026-09-01
source: >-
  Live probes of Keio University surfaces on 2026-09-01, evaluated against the Kin Score
  `education` regulatory regime standards list (scim, lti, oneroster, ed-fi, caliper, qti, oai-pmh,
  shibboleth, saml, orcid, datacite, crossref). Every entry below cites a URL that was fetched and
  the status it returned.
provider: Keio University
providerId: keio
regime: education
description: >-
  Domain-standard conformance for Keio University, read from the contracts and metadata themselves
  rather than from any prose claim — Keio makes no public conformance claim about any of these
  standards anywhere we could find, in Japanese or English. Every hit carries the operator of the
  surface it was found on, because a standard implemented by a platform the university rents is a
  fact about the platform first. Reward-only: nothing is asserted that was not observed in a live
  response, and the standards that were probed and not found are listed under `not_conformant`
  rather than silently omitted.

standards:
  - id: oai-pmh
    version: '2.0'
    status: confirmed
    x-operator: institution
    evidence: >-
      Live, anonymous OAI-PMH 2.0 interface for KOARA, Keio's institutional repository, on Keio's
      own host. Identify reports repositoryName `koara`, protocolVersion `2.0`, granularity
      `YYYY-MM-DDThh:mm:ssZ`, deletedRecord `transient`, earliestDatestamp `1970-01-01T00:00:00Z`
      and adminEmail `mchq-system-group@keio.jp`. ListMetadataFormats advertises `oai_dc` and
      `junii2`. ListSets returns 100 sets scoped under `/Public` and named for Keio faculties,
      graduate schools and research centres. ListIdentifiers and GetRecord both return well-formed
      records. Protocol errors are correctly expressed as `<error code='badVerb'>` in the body.
    location: https://koara.lib.keio.ac.jp/xoonips/modules/xoonips/oai.php?verb=Identify
    status_code: 200
    artifact: examples/keio-koara-oai-identify.xml
    contract: openapi/keio-koara-oai-pmh-openapi.yml
    notes: >-
      Two conformance observations recorded as-is. The earliestDatestamp of 1970-01-01T00:00:00Z is
      an epoch default rather than a real repository earliest date, which degrades incremental
      harvesting. The Identify response repeats the same adminEmail three times.

  - id: shibboleth
    status: confirmed
    x-operator: institution
    evidence: >-
      Keio University is a registered identity provider in GakuNin, the Japanese academic SAML
      federation operated by the National Institute of Informatics, under entityID
      https://gakunin1.keio.ac.jp/idp/shibboleth, registered 2014-02-24. The entity carries a
      Shibboleth-namespace scope element (`shibmd:Scope` = `keio.ac.jp`), mdui:UIInfo display names
      in English and Japanese, mdui:DiscoHints, two key descriptors, and a technical contact at
      Keio's Information Technology Center. GakuNin follows the Shibboleth/REFEDS federation model
      and interfederates with eduGAIN, where the same entity appears as 853677.
    location: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    status_code: 200
    artifact: examples/keio-gakunin-idp-metadata.xml
    detail_artifact: identity-federation/keio-identity-federation.yml

  - id: saml
    version: '2.0'
    status: confirmed
    x-operator: institution
    evidence: >-
      Keio's federation entity declares
      `protocolSupportEnumeration="urn:oasis:names:tc:SAML:2.0:protocol"` with an IDPSSODescriptor
      role, the transient NameID format, and SingleSignOnService endpoints on both the HTTP-POST
      and HTTP-Redirect bindings. Independently corroborated at the application layer: Keio's
      gslbs.keio.jp responds to an anonymous request with a SAML 2.0 AuthnRequest redirect.
    location: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    status_code: 200
    artifact: examples/keio-gakunin-idp-metadata.xml
    notes: >-
      The entityID is Keio's; the SSO endpoints resolve to keio.ex-tic.com, a Keio tenant on the
      Extic identity platform. The SAML conformance is real and the identity is the institution's;
      the software running the assertion service is a vendor's.

  - id: datacite
    status: confirmed
    x-operator: registry
    evidence: >-
      Keio University is a registered DataCite provider — provider id `keio`, symbol `KEIO`,
      memberType `consortium_organization`, non-profit, active, joined 2025-03-11 — holding DOI
      prefix 10.71825 through the FSCO (Figshare) consortium, with one repository client registered
      as `keio.figshare`. This is a fact about the institution's membership in an identifier
      registry, not a contract Keio operates, and the registry's own API is deliberately not saved
      under this repository.
    location: https://api.datacite.org/providers/keio
    status_code: 200
    notes: >-
      Five DOIs had been minted under this provider as of 2026-09-01
      (https://api.datacite.org/dois?provider-id=keio, meta.total = 5). Recorded because an honest
      small number is the measurement; the membership is new (2025) and barely used.

  - id: crossref
    status: confirmed
    x-operator: registry
    evidence: >-
      Two Keio units are registered Crossref members in their own right: member 1082, "Keio Journal
      of Medicine", DOI prefix 10.2302, 1,743 DOIs (54 current, 1,689 backfile), located Tokyo,
      Japan; and member 1443, "Department of Anatomy Keio University School of Medicine", DOI prefix
      10.2535. Membership and DOI counts read directly from the Crossref REST API.
    location: https://api.crossref.org/members?query=keio
    status_code: 200
    notes: >-
      The members are Keio units rather than the university as a single corporate member. Recorded
      as it is registered, not as it would be tidier to record it.

  - id: orcid
    status: partial
    x-operator: registry
    evidence: >-
      The public ORCID registry holds 4,503 records carrying a "Keio University" employment or
      education affiliation, readable anonymously through the ORCID public API. This evidences
      ORCID adoption at scale across the institution's researchers.
    location: 'https://pub.orcid.org/v3.0/search/?q=affiliation-org-name:%22Keio%20University%22'
    status_code: 200
    notes: >-
      Marked `partial`, not `confirmed`. Affiliation records in the registry are written by
      researchers; they are not proof that Keio is an ORCID member organisation or that it operates
      any ORCID integration. No Keio-side ORCID integration, member API client or public membership
      statement was found. The distinction is kept deliberately — inflating this to `confirmed`
      would credit the institution for its researchers' filing behaviour.

not_conformant:
  - id: scim
    probed:
      - url: https://keio.okta.com/.well-known/openid-configuration
        status: 200
        note: OIDC discovery is public; no SCIM ServiceProviderConfig is exposed to an anonymous caller.
    detail: No publicly readable SCIM 2.0 provisioning endpoint on any probed Keio host.
  - id: lti
    probed:
      - url: https://k-ris.keio.ac.jp/
        status: 200
      - url: https://gslbs.keio.jp/
        status: 200
        note: redirects to keio.okta.com SAML; no LTI platform JWKS reachable
    detail: >-
      Keio runs Canvas as K-LMS, but no LTI 1.3 tool-platform JWKS or public LTI registration
      surface was reachable without an account. Not claimed.
  - id: oneroster
    detail: No OneRoster surface found on any probed host.
  - id: ed-fi
    detail: No Ed-Fi surface found. Ed-Fi is a US K-12 standard with essentially no Japanese HE adoption.
  - id: caliper
    detail: No Caliper Analytics endpoint found.
  - id: qti
    detail: No QTI content or delivery surface found on a public host.

collateral_findings:
  - id: junii2
    status: confirmed
    x-operator: institution
    detail: >-
      KOARA advertises the `junii2` metadata prefix (schema http://irdb.nii.ac.jp/oai/junii2-3-1.xsd,
      namespace http://irdb.nii.ac.jp/oai) alongside `oai_dc`. junii2 is the National Institute of
      Informatics' metadata schema for Japanese institutional repositories and is the format IRDB
      harvests. It is not in the education regime's standards list, so it scores nothing — but it is
      a real, national-level interoperability conformance and is recorded rather than dropped.
    location: https://koara.lib.keio.ac.jp/xoonips/modules/xoonips/oai.php?verb=ListMetadataFormats
    status_code: 200
    artifact: examples/keio-koara-oai-listmetadataformats.xml
  - id: iiif
    version: 'Presentation 2.1 / Image 2.0 Level 1'
    status: confirmed
    x-operator: institution
    detail: >-
      Keio University Media Center serves IIIF Presentation API 2.1 manifests from
      dcollections.lib.keio.ac.jp and IIIF Image API 2.0 Level 1 from iiif.lib.keio.ac.jp, both on
      the institution's own hosts and both anonymously readable. IIIF is not in the education
      regime's standards list and therefore scores nothing under
      `domain_standard_conformance` — but it is the largest genuinely institution-operated
      machine-readable surface Keio has, and omitting it because the rubric has no slot for it
      would be the measurement error, not the finding.
    location: https://iiif.lib.keio.ac.jp/iipsrv/GTB/tif/000a.tif/info.json
    status_code: 200
    contract: openapi/keio-iiif-openapi.yml
  - id: ror
    status: confirmed
    x-operator: registry
    detail: >-
      Keio University is registered in the Research Organization Registry as
      https://ror.org/02kn6nx58, with domain keio.ac.jp, established 1858, located in Tokyo, and
      cross-referenced to Funder Registry 501100001697, GRID grid.26091.3c, ISNI
      0000 0004 1936 9959 and Wikidata Q815432. Not a regime standard; recorded as the canonical
      institutional identifier this repository's identity claims resolve against.
    location: https://api.ror.org/organizations?query=Keio+University
    status_code: 200
