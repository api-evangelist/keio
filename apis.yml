apis:
  - aid: keio:koara-oai-pmh
    name: KOARA OAI-PMH Metadata API
    description: >-
      KOARA (KeiO Associated Repository of Academic resources) is Keio University's institutional
      repository, released by the Media Center in 2006 and running on the open-source XooNips
      platform on Keio's own host. Its OAI-PMH 2.0 interface is live, anonymous and complete:
      Identify reports protocolVersion 2.0, second-level datestamp granularity and adminEmail
      mchq-system-group@keio.jp; ListMetadataFormats advertises oai_dc and junii2 (the National
      Institute of Informatics schema that IRDB harvests); ListSets returns 100 sets named for the
      faculties, graduate schools and research centres that deposit into it. An agent can harvest
      the university's entire scholarly record without a key. One behaviour is worth knowing before
      integrating: protocol failures come back with HTTP 200 and the error inside the XML body.
    humanURL: https://koara.lib.keio.ac.jp/doc/KOARA_About_en.htm
    baseURL: https://koara.lib.keio.ac.jp/xoonips/modules/xoonips/oai.php
    tags:
      - OAI-PMH
      - Institutional Repository
      - Metadata
      - Open Access
      - Research
      - Harvesting
    properties:
      - type: Documentation
        url: https://koara.lib.keio.ac.jp/doc/KOARA_About_en.htm
      - type: OpenAPI
        url: openapi/keio-koara-oai-pmh-openapi.yml
      - type: Examples
        url: examples/index.yml
      - type: Conformance
        url: conformance/keio-conformance.yml
      - type: Errors
        url: errors/keio-errors.yml
    x-operator: institution
    x-operator-evidence: >-
      Host koara.lib.keio.ac.jp is under Keio's own registrable domain keio.ac.jp; the Identify
      response's adminEmail is mchq-system-group@keio.jp; the repository software (XooNips) is
      open source and self-hosted, with no vendor host, vendor contact or shared vendor contract
      in the path.
    x-access: open
    x-status: 200 on Identify, ListMetadataFormats, ListSets, ListIdentifiers and GetRecord (probed 2026-09-01)

  - aid: keio:iiif
    name: Keio Media Center Digital Collections IIIF API
    description: >-
      The Keio University Media Center serves its digitised special collections as IIIF on two
      hosts it owns: dcollections.lib.keio.ac.jp for IIIF Presentation API 2.1 manifests, and
      iiif.lib.keio.ac.jp for IIIF Image API 2.0 Level 1 tiles from an IIPImage server. Both are
      anonymous and self-describing. The Gutenberg 42-line Bible manifest alone carries 656
      canvases, attributed to 慶應義塾大学メディアセンター / Keio University Libraries; the image
      service answers arbitrary region, size and rotation requests with a seven-level size pyramid
      and 256px tiles. This is the largest genuinely institution-operated machine-readable surface
      Keio has, and it was entirely absent from this catalog before 2026-09-01. Its one real
      limitation is discovery: collection archive codes are published nowhere, so manifest URLs must
      be resolved out of the site's HTML.
    humanURL: https://dcollections.lib.keio.ac.jp/en
    baseURL: https://dcollections.lib.keio.ac.jp/sites/default/files/iiif/
    tags:
      - IIIF
      - Digital Collections
      - Cultural Heritage
      - Rare Books
      - Images
      - Open Access
    properties:
      - type: Documentation
        url: https://dcollections.lib.keio.ac.jp/ja/about
      - type: OpenAPI
        url: openapi/keio-iiif-openapi.yml
      - type: JSONSchema
        url: json-schema/keio-iiif-manifest-schema.json
      - type: JSONSchema
        url: json-schema/keio-iiif-image-info-schema.json
      - type: Examples
        url: examples/index.yml
    x-operator: institution
    x-operator-evidence: >-
      Both serving hosts are under keio.ac.jp. The manifest's own @id resolves to
      dcollections.lib.keio.ac.jp and its attribution names Keio University Libraries; the image
      service @id resolves to iiif.lib.keio.ac.jp. IIIF is an open specification rather than a
      product, so there is no vendor contract being borrowed here — the deployment is Keio's.
      The Drupal front end was built by a vendor (the sitemap leaks a da.media.opst.biz build host)
      but the images, manifests, hosts and rights statement are the institution's.
    x-access: open
    x-status: >-
      200 on manifest.json, info.json and a rendered image request; 404 on eight unpublished archive
      codes (probed 2026-09-01)

  - aid: keio:gakunin-idp
    name: Keio University Identity Provider (GakuNin / eduGAIN)
    description: >-
      Keio operates its own SAML 2.0 identity provider under entityID
      https://gakunin1.keio.ac.jp/idp/shibboleth, registered in GakuNin — the Japanese academic
      access-management federation operated by the National Institute of Informatics — since
      2014-02-24, and republished into eduGAIN as entity 853677. The metadata asserts scope
      keio.ac.jp, bilingual display names, discovery hints covering the 131.113.0.0/16 and
      133.27.0.0/16 networks and the keio.ac.jp and keio.jp domains, and a technical contact at
      Keio's Information Technology Center. Identity federation is the surface class a university
      operates by definition and is almost never catalogued for; for Keio it is the strongest
      artifact carrying the institution's own name. The entityID and the scope are Keio's; the SSO
      endpoints resolve to keio.ex-tic.com, a Keio tenant on the Extic identity platform, which is
      recorded as a tenancy rather than deducted from the institution's ownership of the entity.
    humanURL: https://www.gakunin.jp/en
    baseURL: https://metadata.gakunin.nii.ac.jp/gakunin-metadata.xml
    tags:
      - Identity Federation
      - Shibboleth
      - SAML
      - eduGAIN
      - GakuNin
      - Single Sign-On
    properties:
      - type: IdentityFederation
        url: identity-federation/keio-identity-federation.yml
      - type: Documentation
        url: https://technical.edugain.org/entities
      - type: Conformance
        url: conformance/keio-conformance.yml
    x-operator: federation
    x-operator-evidence: >-
      The entityID is under keio.ac.jp; the metadata's Organization block names Keio University /
      慶應義塾大学 with OrganizationURL http://www.keio.ac.jp; the technical contact is
      gakunin@itc.keio.ac.jp (Keio Information Technology Center); the asserted shibmd:Scope is
      keio.ac.jp. A federation aggregate is shared by definition — the IdP inside it is Keio's.
    x-access: federated
    x-status: >-
      GakuNin aggregate 200 (5,653,150 bytes) and eduGAIN entity register 200, both probed
      2026-09-01. The entityID host gakunin1.keio.ac.jp itself presents an expired TLS certificate.

  - aid: keio:okta
    name: Keio Okta Tenant — OpenID Connect
    description: >-
      Keio runs an Okta tenant at keio.okta.com behind its campus applications; gslbs.keio.jp
      redirects an anonymous request into a SAML authentication request against it. The tenant's
      OpenID Connect discovery document is anonymously readable and advertises authorization, token,
      userinfo, JWKS and client-registration endpoints. The tenant, the users and the applications
      are Keio's; the identity service, its contract and its engineering are Okta's, and the
      discovery document is the one Okta publishes for every org — so Okta's contract is
      deliberately not saved under this institution. Readable, but not consumable: a client_id
      exists only if Keio IT creates one.
    humanURL: https://keio.okta.com/
    baseURL: https://keio.okta.com/.well-known/openid-configuration
    tags:
      - Single Sign-On
      - OpenID Connect
      - OAuth
      - Identity
      - Gated
    properties:
      - type: Authentication
        url: authentication/keio-authentication.yml
      - type: Examples
        url: examples/keio-okta-openid-configuration.json
    x-operator: tenant
    x-operator-evidence: >-
      keio.okta.com is a Keio-specific tenant subdomain on Okta's shared identity platform. The
      issuer, endpoints and document shape are Okta's standard org configuration, identical for
      every customer.
    x-operator-note: >-
      audit-university-contracts.py returns `federation` for this host, because its rule reads any
      identity host as a federation carrying the institution's own IdP. `tenant` is kept
      deliberately as the more precise verdict: an Okta org is a commercial platform tenancy, not a
      national or interfederation registry, and Keio's actual federated identity lives in the
      separate keio:gakunin-idp entry. Both verdicts agree the relationship is real and must never
      be deleted; only the label differs.
    x-access: gated
    x-status: 200 on both the org and default authorization-server discovery documents (probed 2026-09-01)

  - aid: keio:k-ris
    name: K-RIS — Keio Research Information System (Elsevier Pure)
    description: >-
      K-RIS (慶應義塾 研究者情報データベース) is Keio's researcher information system, holding
      faculty profiles, publications and research outputs. It runs on Elsevier Pure at
      k-ris.keio.ac.jp. The researchers, the outputs and the host are Keio's; the software and the
      contract are Elsevier's — this is exactly the class of surface that produced the
      misattribution the university pipeline exists to prevent, and Pure's generic contract is
      deliberately not saved under this institution. On this deployment the Pure web service is not
      exposed at all: /ws/api and /ws/api/openapi.json both return 404, so there is no readable
      machine interface here even for the vendor's contract.
