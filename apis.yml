x-coverage:
  state: covered
  reason: covered
  detail: >-
    Keio is a correctly thin but genuinely non-empty profile, and the 2026-09-01 pass moved it from
    one surface to nine. Two institution-operated APIs are live, anonymous and fully consumable
    today — KOARA's OAI-PMH 2.0 interface (all six verbs probed, 100 sets, oai_dc and junii2) and
    the Media Center's IIIF Presentation 2.1 and Image 2.0 Level 1 endpoints (manifest, info.json
    and a rendered image request all 200). Keio also operates its own Shibboleth/SAML identity
    provider, registered in GakuNin since 2014 and republished into eduGAIN, which is the
    institution-owned surface class this cohort was most completely missing. Beyond those, the
    estate is tenancies and registry memberships, each recorded as a relationship with the vendor's
    contract deliberately withheld: Elsevier Pure behind K-RIS (whose /ws/api returns 404, so not
    even the vendor's interface is readable), an Okta tenant whose OIDC discovery is public but
    whose client registration is not reachable, a Figshare repository evidenced through DataCite's
    registry rather than through the bot-interstitialled host, and DataCite, Crossref and ROR
    registrations. What Keio does not have is equally clear and was probed rather than assumed:
    api.keio.ac.jp and data.keio.ac.jp do not resolve, there is no developer portal, no open-data
    portal, no public course catalog or timetable API, no research-computing service catalog, no
    published OpenAPI or apis.json, no changelog, no status page, no llms.txt, no MCP server, and
    the main web estate serves neither robots.txt nor security.txt. No probe was blocked in a way
    that hid a finding; the only bot rejections encountered were LinkedIn's 999 and Figshare's 202,
    both platform edges rather than facts about Keio.
