aid: keio
name: Keio University
description: >-
  Keio University (慶應義塾大学) is a private research university in Tokyo, Japan, founded by
  Fukuzawa Yukichi in 1858 and the oldest institution of modern higher education in the country.
  Its programmable footprint is small, entirely non-commercial, and — unusually for this cohort —
  genuinely its own rather than a vendor's running under its name. Two surfaces are operated by
  Keio on Keio's hosts and are anonymously consumable today: KOARA, the institutional repository,
  which serves a live OAI-PMH 2.0 harvesting interface advertising Dublin Core and the NII junii2
  schema across 100 faculty and research-centre sets; and the Media Center's Digital Collections,
  which serve IIIF Presentation 2.1 manifests and IIIF Image 2.0 Level 1 tiles for the university's
  digitised rare books, including all 656 folios of its Gutenberg 42-line Bible. Keio also operates
  its own Shibboleth/SAML identity provider, registered in the GakuNin federation since 2014 and
  republished into eduGAIN — the strongest institution-owned machine-readable artifact it has.
  Beyond those, the estate is a set of tenancies and registry memberships rather than engineering:
  K-RIS runs on Elsevier Pure, campus sign-on runs through an Okta tenant and an Extic-hosted SSO
  service, research data DOIs are minted through a Figshare consortium seat at DataCite, and two
  Keio units hold Crossref memberships in their own right. There is no developer portal, no API
  key, no changelog and no published OpenAPI anywhere in the estate; every contract in this
  repository was written by API Evangelist from live probes and is marked as such.
